[package]
name = "sns-categories"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
no-entrypoint = []
test-bpf = []
no-signer = []

[dependencies]
solana-program = "4.0.0"
solana-decode-error = "2.3.0"
solana-program-error = "3.0.0"
borsh = "1.8.1"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
bonfida-utils = "0.9.2"
spl-associated-token-account = { version = "8.0.0", features = [
    "no-entrypoint",
] }
spl-name-service = { version = "0.5.0", features = [
    "no-entrypoint",
], package = "spl-name-service-2" }
solana-security-txt = "1.1.2"

num_enum = "0.6.1"
thiserror = "1.0.24"
num-traits = "0.2"
num-derive = "0.3"
enumflags2 = "0.7.1"
solana-system-interface = { version = "3.2.0" }


[dev-dependencies]
solana-sdk = "4.0.1"
hexdump = "0.1.0"
rand = "0.8.4"
arrayref = "0.3.6"
solana-program-test = { version = "4.2.2", features = ["agave-unstable-api"] }
tokio = { version = "1.6", features = ["macros"] }


[lib]
crate-type = ["cdylib", "lib"]
